name: Purge jsDelivr cache
# jsDelivr caches @main for up to 12 hours. Purge uip.js after each push so the skill shows the new catalog right away.
on:
  push:
    branches: [main]
    paths: ['uip.js']
  workflow_dispatch:
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge uip.js
        run: |
          for i in 1 2 3; do
            curl -fsS "https://purge.jsdelivr.net/gh/eminoart/ui-pattern-picker@main/uip.js" && exit 0
            sleep 10
          done
          exit 1
